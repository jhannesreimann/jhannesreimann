name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # real game of Snake: grows one segment per commit cell it eats,
      # hunts cells via BFS and avoids its own body.
      # https://github.com/dahan8473/snake-and-commits
      - name: Generate snake
        uses: dahan8473/snake-and-commits@v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/github-contribution-grid-snake-dark.svg
          theme: green

      - name: Copy for light slot
        run: cp dist/github-contribution-grid-snake-dark.svg dist/github-contribution-grid-snake.svg

      - name: Recolor variants to match profile card
        run: |
          python3 scripts/recolor_snake.py --theme dark dist/github-contribution-grid-snake-dark.svg
          python3 scripts/recolor_snake.py --theme light dist/github-contribution-grid-snake.svg

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
