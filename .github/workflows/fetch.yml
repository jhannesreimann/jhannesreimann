name: Regenerate profile card

on:
  schedule:
    - cron: "17 4 * * *" # daily, shortly before the snake run
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/fetch-*.svg"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render card from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch.py

      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fetch-dark.svg assets/fetch-light.svg
          git diff --cached --quiet || git commit -m "refresh profile card"
          git push
